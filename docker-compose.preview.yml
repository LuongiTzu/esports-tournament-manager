services:
  frontend:
    image: esports-frontend-preview:local
    build:
      target: production
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    command: ["node", "server.js"]
    volumes: !reset []
